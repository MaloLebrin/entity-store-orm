name: Bug report
description: Something does not behave as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@entity-store/core 0.1.0"
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code or a repository link
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations: { required: true }
