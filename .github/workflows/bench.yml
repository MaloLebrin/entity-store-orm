name: 📊 Benchmark

# Informational only: shared runners are noisy, so absolute numbers vary a lot
# between runs. Read the ratios (core vs RTK, memoized vs not) in the job summary.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/core/**'
      - 'tests/bench/**'
      - '.github/workflows/bench.yml'

jobs:
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @entity-store/core build
      - name: Run benchmark
        run: |
          pnpm bench | tee bench.txt
          {
            echo '## Benchmark (ops/s, noisy shared runner)'
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
