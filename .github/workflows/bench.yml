name: 📊 Benchmark

# Two jobs:
# - `bench-check` GATES the PR: it only compares ratios between scenarios run
#   back to back (median of several rounds, wide floors), so it fails on a clear
#   regression but not on shared-runner noise. See tests/bench/src/check.ts.
# - `bench` is informational (continue-on-error): absolute numbers vary a lot
#   between runs. Read the ratios (core vs RTK, memoized vs not) in the summary.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/core/**"
      - "tests/bench/**"
      - ".github/workflows/bench.yml"

jobs:
  bench-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @entity-store/core build
      - name: Check for performance regressions
        shell: bash # enables pipefail, so a failing check is not hidden by `tee`
        run: |
          pnpm bench:check | tee bench-check.txt
          {
            echo '## Benchmark regression gate (ratios, median of 3 rounds)'
            cat bench-check.txt
          } >> "$GITHUB_STEP_SUMMARY"

  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @entity-store/core build
      - name: Run benchmark
        run: |
          pnpm bench | tee bench.txt
          {
            echo '## Benchmark (ops/s, noisy shared runner)'
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
