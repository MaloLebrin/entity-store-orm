name: 🛠 Tests-CI

on:
  pull_request:

env:
  NODE_ENV: prod

jobs:
  StyleGuides_checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [24.x]
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ Set node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: 🔧 Install
        run: pnpm install --frozen-lockfile

      - name: 🧹 Lint
        run: pnpm lint

      - name: 🏗️ Build
        run: pnpm build

      - name: ☑️ Type checking
        run: pnpm type-check

      - name: ✅ Tests
        run: pnpm test

      - name: 📦 Validate packages (publint + attw)
        run: pnpm -r check:package

      - name: 🧪 Consumer test (packed tarballs, ESM/CJS/types)
        run: pnpm test:consumer
